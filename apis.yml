aid: insightec
name: Insightec
description: 'Insightec Ltd. is an Israeli medical device company, founded in 1999
  and headquartered in Tirat Carmel, Israel, that develops and sells MR-guided focused
  ultrasound (MRgFUS) systems under the Exablate brand. Its Exablate Neuro platform
  focuses more than a thousand ultrasound beams through the intact skull to ablate
  a target deep in the brain without an incision, and is approved for essential tremor
  and Parkinson''s disease, including staged bilateral treatment. The Exablate body
  platform is used for uterine fibroids, palliation of bone metastases, and prostate
  indications, and the company runs clinical programs in blood-brain-barrier opening
  and glioblastoma. Insightec publishes a public product documentation portal of operator
  manuals and handbooks for the Exablate systems, but publishes no public developer
  portal, API documentation, machine-readable API contract, SDKs, or agent surface;
  its systems integrate with GE and Siemens MR scanners as clinical devices rather
  than through a public API.'
